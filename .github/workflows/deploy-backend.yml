name: Deploy Backend EC2

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BACKEND_SSH_PRIVATE_KEY }}" > ~/.ssh/backend_key
          chmod 600 ~/.ssh/backend_key
          ssh-keyscan -H "${{ vars.BACKEND_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy backend compose files
        run: |
          ssh -i ~/.ssh/backend_key ubuntu@${{ vars.BACKEND_HOST }} "mkdir -p ~/coe558/backend"

          scp -i ~/.ssh/backend_key -r deploy/backend/* \
            ubuntu@${{ vars.BACKEND_HOST }}:~/coe558/backend/

          ssh -i ~/.ssh/backend_key ubuntu@${{ vars.BACKEND_HOST }} "mkdir -p ~/coe558/backend/api_docs"

          scp -i ~/.ssh/backend_key api_docs/openapi.yaml \
            ubuntu@${{ vars.BACKEND_HOST }}:~/coe558/backend/api_docs/openapi.yaml

      - name: Deploy backend
        run: |
          ssh -i ~/.ssh/backend_key ubuntu@${{ vars.BACKEND_HOST }} << 'EOF'
          set -e

          cd ~/coe558/deploy/backend

          touch traefik/acme.json
          chmod 600 traefik/acme.json

          cat > .env << ENV
          API_DOMAIN=${{ vars.API_DOMAIN }}
          AWS_REGION=${{ vars.AWS_REGION }}
          S3_BUCKET=${{ vars.S3_BUCKET }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL=${{ vars.GEMINI_IMAGE_MODEL }}
          GEMINI_MULTIMODAL_MODEL=${{ vars.GEMINI_MULTIMODAL_MODEL }}
          GEMINI_TEXT_MODEL=${{ vars.GEMINI_TEXT_MODEL }}
          MONGO_ROOT_USERNAME=${{ vars.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB=${{ vars.MONGO_DB }}
          MONGO_COLLECTION=${{ vars.MONGO_COLLECTION }}
          OPENAPI_FILE_PATH=${{ vars.OPENAPI_FILE_PATH }}
          ENV

          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          docker compose pull
          docker compose up -d
          docker image prune -f
          EOF