name: Deploy Frontend EC2

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FRONTEND_SSH_PRIVATE_KEY }}" > ~/.ssh/frontend_key
          chmod 600 ~/.ssh/frontend_key
          ssh-keyscan -H "${{ vars.FRONTEND_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy frontend compose files
        run: |
          ssh -i ~/.ssh/frontend_key ubuntu@${{ vars.FRONTEND_HOST }} "mkdir -p ~/coe558/deploy/frontend"
          scp -i ~/.ssh/frontend_key -r deploy/frontend/* ubuntu@${{ vars.FRONTEND_HOST }}:~/coe558/deploy/frontend/

      - name: Deploy frontend
        run: |
          ssh -i ~/.ssh/frontend_key ubuntu@${{ vars.FRONTEND_HOST }} << 'EOF'
          set -e

          cd ~/coe558/deploy/frontend

          touch acme.json
          chmod 600 acme.json

          cat > .env << ENV
          FRONTEND_DOMAIN=${{ vars.FRONTEND_DOMAIN }}
          ENV

          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          docker compose pull
          docker compose up -d
          docker image prune -f
          EOF