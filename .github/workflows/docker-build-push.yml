name: Build and Push Docker Images

on:
  push:
    branches: ["master"]
    paths:
      - "apps/frontend/**"
      - "apps/genai_service/**"
      - "apps/backend/**"
      - ".github/workflows/docker-build-push.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: frontend
            context: apps/frontend
            image: coe558-frontend
          - name: genai-service
            context: apps/genai_service
            image: coe558-genai-service
          - name: backend
            context: apps/backend
            image: coe558-backend

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image }}:latest \
            ${{ matrix.service.context }}

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image }}:latest