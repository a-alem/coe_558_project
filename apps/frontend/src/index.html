<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>COE558 Weather & GenAI Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">COE558 Weather & GenAI App</span>
    </div>
</nav>

<main class="container py-4">
    <section class="card mb-4">
        <div class="card-header">
            Weather Service
        </div>
        <div class="card-body">
            <button id="currentLocationBtn" class="btn btn-primary mb-3">
                Use My Current Location
            </button>

            <div class="row g-2 mb-3">
                <div class="col-md-5">
                    <input id="latInput" class="form-control" placeholder="Latitude">
                </div>
                <div class="col-md-5">
                    <input id="lonInput" class="form-control" placeholder="Longitude">
                </div>
                <div class="col-md-2">
                    <button id="weatherBtn" class="btn btn-secondary w-100">
                        Search
                    </button>
                </div>
            </div>

            <div id="weatherResult" class="alert alert-info d-none"></div>
        </div>
    </section>

    <section class="card mb-4">
        <div class="card-header">
            GenAI Service
        </div>
        <div class="card-body">
        <textarea
                id="promptInput"
                class="form-control mb-3"
                rows="4"
                placeholder="Enter your GenAI prompt..."
        ></textarea>

            <button id="generateBtn" class="btn btn-success">
                Generate
            </button>

            <button id="saveBtn" class="btn btn-outline-primary" disabled>
                Save Result
            </button>

            <pre id="genaiResult" class="bg-dark text-white p-3 rounded mt-3 d-none"></pre>
        </div>
    </section>

    <section class="card">
        <div class="card-header d-flex justify-content-between">
            <span>Saved Results</span>
            <button id="refreshResultsBtn" class="btn btn-sm btn-outline-secondary">
                Refresh
            </button>
        </div>
        <div class="card-body">
            <div id="savedResults"></div>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
