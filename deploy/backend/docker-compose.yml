services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
      - "./traefik/letsencrypt/acme.json:/letsencrypt/acme.json"

  genai-service:
    image: ghcr.io/a-alem/coe558-genai-service:latest
    container_name: genai-service
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL}
      GEMINI_MULTIMODAL_MODEL: ${GEMINI_MULTIMODAL_MODEL}
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.genai.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/genai`)"
      - "traefik.http.routers.genai.entrypoints=websecure"
      - "traefik.http.routers.genai.tls=true"
      - "traefik.http.routers.genai.tls.certresolver=letsencrypt"
      - "traefik.http.routers.genai.service=genai"
      - "traefik.http.middlewares.genai-strip.stripprefix.prefixes=/api/genai"
      - "traefik.http.routers.genai.middlewares=genai-strip,cors@file"
      - "traefik.http.services.genai.loadbalancer.server.port=8000"

  backend:
    image: ghcr.io/a-alem/coe558-backend:latest
    container_name: backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      MONGO_DB: ${MONGO_DB}
      MONGO_COLLECTION: ${MONGO_COLLECTION}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
    networks:
      - backend
    depends_on:
      - mongodb
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-results.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/results`)"
      - "traefik.http.routers.backend-results.entrypoints=websecure"
      - "traefik.http.routers.backend-results.tls=true"
      - "traefik.http.routers.backend-results.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-results.service=backend"
      - "traefik.http.middlewares.backend-results-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend-results.middlewares=backend-results-strip,cors@file"
      - "traefik.http.routers.backend-health.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/backend`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend-health.entrypoints=websecure"
      - "traefik.http.routers.backend-health.tls=true"
      - "traefik.http.routers.backend-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-health.service=backend"
      - "traefik.http.middlewares.backend-health-strip.stripprefix.prefixes=/api/backend"
      - "traefik.http.routers.backend-health.middlewares=backend-health-strip,cors@file"

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    networks:
      - backend

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - "${OPENAPI_FILE_PATH:-../../api_docs/openapi.yaml}:/openapi/openapi.yaml:ro"
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swagger.rule=Host(`api.coe558projectkfupm.com`) && PathPrefix(`/docs`)"
      - "traefik.http.routers.swagger.entrypoints=websecure"
      - "traefik.http.routers.swagger.tls=true"
      - "traefik.http.routers.swagger.tls.certresolver=letsencrypt"
      - "traefik.http.routers.swagger.service=swagger"
      - "traefik.http.routers.swagger.middlewares=cors@file"
      - "traefik.http.services.swagger.loadbalancer.server.port=8080"
      - "traefik.http.routers.swagger-assets.entrypoints=websecure"
      - "traefik.http.routers.swagger-assets.tls=true"
      - "traefik.http.routers.swagger-assets.tls.certresolver=letsencrypt"
      - "traefik.http.routers.swagger-assets.service=swagger"
      - "traefik.http.routers.swagger-assets.middlewares=cors@file"
      # For Swagger UI static assets
      - "traefik.http.routers.swagger-assets.rule=Host(`api.coe558projectkfupm.com`) && (Path(`/swagger-ui.css`) || Path(`/index.css`) || Path(`/swagger-ui-bundle.js`) || Path(`/swagger-ui-standalone-preset.js`) || Path(`/swagger-initializer.js`) || Path(`/favicon-32x32.png`) || Path(`/favicon-16x16.png`) || Path(`/oauth2-redirect.html`))"

networks:
  backend:

volumes:
  mongodb-data: