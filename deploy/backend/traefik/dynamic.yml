http:
  routers:
    weather:
      rule: "Host(`api.coe558projectkfupm.com`) && PathPrefix(`/api/weather`)"
      entryPoints:
        - websecure
      service: weather-lambda
      tls:
        certResolver: letsencrypt
      middlewares:
        - weather-strip
        - cors

  middlewares:
    weather-strip:
      stripPrefix:
        prefixes:
          - "/api/weather"

    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlAllowOriginList:
          - "https://www.coe558projectkfupm.com"
          - "https://coe558projectkfupm.com"
        accessControlMaxAge: 100
        addVaryHeader: true

  services:
    weather-lambda:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "https://5mtgt4rjqcnuyakhf4rmphtphi0yozaf.lambda-url.eu-central-1.on.aws"