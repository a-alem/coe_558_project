entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: abdulelah.alem@outlook.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web